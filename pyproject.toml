[project]
name = "classification-of-advertising-creatives"
version = "1.0.0"
readme = "README.md"
requires-python = "~=3.10"

[tool.ruff]
src = ["backend", "frontend"]
fix = false
respect-gitignore = true
line-length = 120
indent-width = 4

lint.select = [
    "RUF", "E", "W", "F", "N", "I", "UP", "YTT", "S", "BLE", "B",
    "COM", "C4", "T10", "FA", "ISC", "PIE", "T20", "PT", "Q002",
    "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "ARG", "PTH",
    "ERA", "PGH", "PL", "TRY", "FLY", "PERF",
]
lint.ignore = [
    "RUF001", "RUF002", "RUF003",
    "S108", "D1", "D203", "D212",
    "SIM108", "N818", "S314", "B008",
]
lint.per-file-ignores."**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.pylint]
max-args = 10
